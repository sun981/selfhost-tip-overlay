# Fixed project name: container/volume/network names stay `tip-overlay-*` no matter
# what the clone folder is called (compose otherwise derives names from the directory).
name: tip-overlay

services:
  backend:
    # Prebuilt image published by CI on each release tag (pinned to a minor —
    # patch releases apply on `docker compose pull && docker compose up -d`).
    # `build:` stays for forks/dev: `docker compose build backend` overrides.
    image: ghcr.io/sun981/selfhost-tip-overlay:0.2
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/tips.db}
    volumes:
      - db_data:/data
      # User customization (survives updates): user/settings.json overrides the
      # image-baked app/settings.json. See user/README.md.
      - ./user:/app/user:ro
    tmpfs:
      - /tmp
    networks:
      - internal
      - tunnel
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: nginx:1.30.2-alpine@sha256:5f979dcfed4ce6461873f087e8c980d6e29b084b9e8776d9704a7e989b5f4898
    volumes:
      - ./app/tip:/usr/share/nginx/html:ro
      # user theme override, served at /user/ via nginx alias (can't nest a
      # mount inside the :ro html bind above) — see user/README.md
      - ./user/web:/srv/user:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      # IPv4-explicit: `localhost` resolves to ::1 first in alpine 3.x, but nginx is
      # `listen 80;` (IPv4 only) → a localhost healthcheck false-fails. Real traffic
      # (cloudflared → frontend:80 via docker DNS) is IPv4 and unaffected.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  overlay:
    image: nginx:1.30.2-alpine@sha256:5f979dcfed4ce6461873f087e8c980d6e29b084b9e8776d9704a7e989b5f4898
    volumes:
      - ./app/overlay:/usr/share/nginx/html:ro
      # user theme + alert-sound override, served at /user/ via nginx alias
      # (can't nest a mount inside the :ro html bind above) — see user/README.md
      - ./user/web:/srv/user:ro
      - ./nginx/overlay.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    networks:
      # internal: reach backend (DNS) for the /api/ proxy
      - internal
      # overlay_host: non-internal bridge so 127.0.0.1:8080 can actually publish.
      # An internal:true network cannot realize a host port — overlay needs this
      # interface for OBS/localhost. Only overlay sits here; backend stays isolated.
      - overlay_host
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0@sha256:ba461b8aa9c042156dbd39c38657fe7431bafa063220eab8d5330a523863da9f
    command: tunnel run
    env_file: .env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tunnel
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true
  tunnel:
    driver: bridge
  # Host↔overlay only. Non-internal so 127.0.0.1:8080 publishes; backend never joins.
  overlay_host:
    driver: bridge

volumes:
  db_data:
    driver: local
