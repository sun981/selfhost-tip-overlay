name: CI

# Runs the security gate on every push/PR, plus weekly so newly-disclosed CVEs in the
# pinned deps turn the build red even when nobody pushed (the hard pip-audit gate).
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # compose has `env_file: .env`; tests force their own hermetic env, so a
      # placeholder .env is enough to satisfy the file requirement.
      - name: Provide placeholder .env
        run: cp .env.example .env

      - name: Build backend image
        run: docker compose build backend

      - name: make verify  # security-invariant suite + hard pip-audit CVE gate + import guard
        run: make verify

  # Prebuilt backend image on every release tag — non-technical users update with
  # `docker compose pull && docker compose up -d`, no git/build toolchain needed.
  # Gated behind verify: a red security suite never publishes an image.
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.2.1 → 0.2.1 + 0.2 (compose pins minor; patch releases auto-apply
          # on `compose pull`). Deliberately no `latest` for money software —
          # flavor latest=false because metadata-action's auto mode adds it on semver.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  secret-scan:
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; gitleaks-action
    # calls the PR API in pull_request mode and 403s without this explicit grant.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so gitleaks can scan every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
