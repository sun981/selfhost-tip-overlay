server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy SSE + read endpoints to backend (overlay subscribes via EventSource)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support — never buffer/cache the event stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Alert audio — nginx default mime.types has no .wav mapping (→ octet-stream).
    # Set it explicitly so the browser plays it without relying on content sniffing.
    location = /sounds/alert.wav {
        default_type audio/wav;
        add_header Cache-Control "no-store";
    }

    # User overrides (./user/web mounted at /srv/user) — alias, so a missing
    # file is a plain 404, never the /index.html fallback below (an HTML body
    # would confuse <link>/<audio>).
    location /user/ {
        alias /srv/user/;
        add_header Cache-Control "no-store";
    }
    location = /user/sounds/alert.wav {
        alias /srv/user/sounds/alert.wav;
        default_type audio/wav;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Strict CSP — server-set (not in HTML meta tag) per ARCHITECTURE §13.2
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self';" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-store";
    }
}
