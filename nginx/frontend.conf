server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Least-privilege public ingress (F2): these endpoints are overlay/local/dev-only
    # and the public tip page never calls them. Don't carry them over the tunnel.
    # Longer prefixes win over /api/ below; 404 hides that they exist.
    location /api/events/ { return 404; }   # overlay SSE stream (overlay runs on 127.0.0.1:8080)
    location /api/tips/   { return 404; }    # PII backfill (supporter name/message)
    location /api/dev/    { return 404; }    # dev test-tip injector (local only, even if flag on)

    # Proxy API and webhook calls to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /webhooks/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # User theme override (./user/web mounted at /srv/user) — alias, so a
    # missing file is a plain 404, never the /index.html fallback below
    # (an HTML body would confuse <link rel=stylesheet>).
    location /user/ {
        alias /srv/user/;
    }

    # Static tip page — strict CSP, server-set (ARCHITECTURE §13.2). The page uses
    # only an external app.js + style.css (no inline script/style), so 'self' is
    # enough; QR image + /api fetches are same-origin.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
